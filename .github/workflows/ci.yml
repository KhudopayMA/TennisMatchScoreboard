name: ci

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_DATABASE: test_db
          MYSQL_ROOT_PASSWORD: test
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_NAME: test_db
      DB_USER: root
      DB_PASSWORD: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    strategy:
      matrix:
        python-version: [ "3.12" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies
        run: uv sync --frozen

      - name: run Ruff linter
        run:
          uv run ruff check .

      - name: run Ruff formatter
        run:
          uv run ruff format

      - name: Run MyPy
        run:
          uv run mypy .

      - name: Run Typos
        run:
          uv run typos

      - name: Run tests
        run:
           uv run pytest --cov=. --cov-fail-under=60 --cov-report=term-missing