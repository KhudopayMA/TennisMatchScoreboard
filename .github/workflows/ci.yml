name: ci

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies
        run: uv sync --frozen

      - name: run Ruff linter
        run:
          uv run ruff check .

      - name: run Ruff formatter
        run:
          uv run ruff format

      - name: Run MyPy
        run:
          uv run mypy .

      - name: Run Typos
        run:
          uv run typos

      - name: Run pytest
        run:
          uv run pytest